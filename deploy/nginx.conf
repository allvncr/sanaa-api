# /etc/nginx/sites-available/sanaa — à activer avec :
#   sudo ln -s /etc/nginx/sites-available/sanaa /etc/nginx/sites-enabled/sanaa
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les blocs SSL (cert_*) sont ajoutés automatiquement par `certbot --nginx`
# (voir deploy/README.md, étape 9) — ne pas les écrire à la main.

server {
    listen 80;
    listen [::]:80;
    server_name admin.sanaa-ci.com;

    # Frontend : fichiers statiques du build Vite (npm run build -> dist/).
    root /var/www/sanaa/frontend/dist;
    index index.html;

    # SPA Vue Router en mode "history" : toute route inconnue retombe sur
    # index.html, sinon un F5 sur /commandes/xxx donnerait un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers avec hash dans leur nom (assets/xxx-<hash>.js) : cache long,
    # Vite change le nom du fichier à chaque nouveau contenu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend Node/Express (PM2, port 4000 en local sur le serveur) : tout ce
    # qui commence par /api/v1 part vers l'API plutôt que vers le frontend.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
    }

    client_max_body_size 5m; # imports Excel / uploads catalogue
}
